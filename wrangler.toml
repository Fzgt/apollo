# Cloudflare Workers Static Assets 配置（Pages 已并入 Workers）。
# 原来的 pages_build_output_dir 是 Pages 专用键，Workers 不认，
# 会报 "Missing entry-point to Worker script or to assets directory"。
#
# name 必须和 Cloudflare 后台的项目名一致，否则会部署到另一个 Worker。

name = "apollo"
compatibility_date = "2026-08-06"

[assets]
directory = "./dist"
# 任何未命中静态文件的请求回退到 index.html，react-router 才能接管路由
not_found_handling = "single-page-application"
